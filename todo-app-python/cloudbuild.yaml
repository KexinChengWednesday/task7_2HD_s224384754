steps:
  # Step 1: Install dependencies and run tests
  - name: 'python:3.11-slim'
    id: 'Run Tests'
    dir: 'python'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest -v

  # Step 2: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Image'
    dir: 'python'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/todo-app-python:$COMMIT_SHA', '.']

  # Step 3: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Image'
    args: ['push', 'gcr.io/$PROJECT_ID/todo-app-python:$COMMIT_SHA']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'todo-app-python'
      - '--image=gcr.io/$PROJECT_ID/todo-app-python:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY